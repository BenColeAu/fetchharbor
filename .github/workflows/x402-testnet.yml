name: x402 Testnet Settlement

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: x402-testnet-settlement
  cancel-in-progress: false

jobs:
  settle:
    name: Real Base Sepolia settlement
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: x402-testnet
    env:
      EVM_PRIVATE_KEY: ${{ secrets.EVM_PRIVATE_KEY }}
      FETCHHARBOR_ENV: test
      FETCHHARBOR_PAYMENT_MODE: x402
      FETCHHARBOR_X402_NETWORK: eip155:84532
      FETCHHARBOR_X402_ASSET: 0x036CbD53842c5426634e7929541eC2318f3dCF7e
      FETCHHARBOR_X402_FACILITATOR: https://x402.org/facilitator
      FETCHHARBOR_ALLOWED_HOSTS: 127.0.0.1,localhost
      FETCHHARBOR_PRICE_HTML_TO_MD_USDC: "0.001"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install FetchHarbor
        run: python -m pip install .

      - name: Validate secret and configure recipient
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EVM_PRIVATE_KEY}"
          address="$(python -c 'import os; from eth_account import Account; print(Account.from_key(os.environ["EVM_PRIVATE_KEY"]).address)')"
          echo "FETCHHARBOR_X402_PAY_TO=${address}" >> "${GITHUB_ENV}"

      - name: Start paid FetchHarbor service
        shell: bash
        run: |
          set -euo pipefail
          uvicorn fetchharbor.main:app --host 127.0.0.1 --port 8080 > /tmp/fetchharbor.log 2>&1 &
          echo $! > /tmp/fetchharbor.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/fetchharbor.log
          exit 1

      - name: Verify and settle a real payment
        run: python scripts/x402_settlement_test.py

      - name: Show server log after failure
        if: failure()
        run: cat /tmp/fetchharbor.log || true

      - name: Stop service
        if: always()
        run: test ! -f /tmp/fetchharbor.pid || kill "$(cat /tmp/fetchharbor.pid)" || true
