name: Docker CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and integration test
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Show Docker environment
        run: |
          docker version
          docker compose version

      - name: Create isolated test configuration
        run: |
          cp .env.example .env
          {
            echo 'FETCHHARBOR_ENV=test'
            echo 'FETCHHARBOR_ADMIN_ENABLED=true'
            echo 'FETCHHARBOR_ADMIN_TOKEN=ci-only-admin-token-with-at-least-32-characters'
            echo 'FETCHHARBOR_ALLOWED_HOSTS=localhost,127.0.0.1'
          } >> .env

      - name: Validate Compose configuration
        run: |
          docker compose config --quiet
          mkdir -p secrets
          printf '%s' 'ci-only-admin-token-with-at-least-32-characters' > secrets/admin_token.txt
          FETCHHARBOR_PUBLIC_HOST=fetchharbor.example.com \
          FETCHHARBOR_ADMIN_HOST=admin.fetchharbor.example.com \
            docker compose -f compose.yaml -f compose.production.yaml config --quiet

      - name: Run tests in the image
        run: |
          docker build --target test --tag fetchharbor:test .
          docker run --rm fetchharbor:test

      - name: Start the Compose API
        run: docker compose up --build --wait --wait-timeout 120 api

      - name: Exercise public and admin contracts
        env:
          ADMIN_TOKEN: ci-only-admin-token-with-at-least-32-characters
        run: |
          set -euo pipefail
          curl --fail --silent --show-error http://127.0.0.1:8080/health | tee /tmp/health.json
          grep --fixed-strings '"status":"ok"' /tmp/health.json

          curl --fail --silent --show-error \
            'http://127.0.0.1:8080/html-to-md?html=%3Ch1%3EHello%3C%2Fh1%3E' \
            | tee /tmp/markdown.json
          grep --fixed-strings '"markdown":"# Hello"' /tmp/markdown.json

          curl --fail --silent --show-error \
            -H "X-Admin-Token: ${ADMIN_TOKEN}" \
            http://127.0.0.1:8080/admin/api/overview \
            | tee /tmp/admin.json
          grep --fixed-strings '"service_count":3' /tmp/admin.json

          status="$(curl --silent --output /tmp/x402-enable.json --write-out '%{http_code}' \
            -X PUT -H "X-Admin-Token: ${ADMIN_TOKEN}" -H 'Content-Type: application/json' \
            --data '{"payment_mode":"x402"}' \
            http://127.0.0.1:8080/admin/api/configuration)"
          test "${status}" = '409'

          curl --fail --silent --show-error \
            -H "X-Admin-Token: ${ADMIN_TOKEN}" \
            http://127.0.0.1:8080/admin/api/security \
            | tee /tmp/security.json
          grep --fixed-strings '"status":"warning"' /tmp/security.json

      - name: Inspect running stack
        run: |
          docker compose ps
          test "$(docker inspect --format '{{.State.Health.Status}}' fetchharbor-api-1)" = 'healthy'

      - name: Show logs after failure
        if: failure()
        run: docker compose logs --no-color --timestamps

      - name: Tear down test stack
        if: always()
        run: docker compose down --volumes --remove-orphans
