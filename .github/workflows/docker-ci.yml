name: Docker CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Release validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Show Docker environment
        run: |
          docker version
          docker compose version

      - name: Create isolated validation configuration
        run: |
          cp .env.example .env
          {
            echo 'FETCHHARBOR_ENV=development'
            echo 'FETCHHARBOR_ADMIN_TOKEN=ci-only-admin-token-with-at-least-32-characters'
            echo 'FETCHHARBOR_ALLOWED_HOSTS=localhost,127.0.0.1'
          } >> .env

      - name: Validate Compose configuration
        run: |
          docker compose config --quiet
          mkdir -p secrets
          printf '%s' 'ci-only-admin-token-with-at-least-32-characters' > secrets/admin_token.txt
          printf '%s' 'ci-validation-key-id' > secrets/cdp_api_key_id.txt
          printf '%s' 'ci-validation-key-secret' > secrets/cdp_api_key_secret.txt
          printf '%s' 'ci-validation-tunnel-token' > secrets/cloudflare_tunnel_token.txt
          printf '%s' 'ci-only-media-token-with-at-least-32-characters' > secrets/media_worker_token.txt
          FETCHHARBOR_PUBLIC_HOST=fetchharbor.example.com \
            docker compose -f compose.yaml -f compose.production.yaml config --quiet
          FETCHHARBOR_PUBLIC_HOST=fetchharbor.example.com \
            docker compose -f compose.yaml -f compose.production.yaml \
              -f compose.mainnet.yaml config --quiet
          FETCHHARBOR_PUBLIC_HOST=fetchharbor.example.com \
            docker compose -f compose.yaml -f compose.production.yaml \
              -f compose.cloudflare-tunnel.yaml config --quiet
          FETCHHARBOR_PUBLIC_HOST=fetchharbor.example.com \
            docker compose -f compose.yaml -f compose.production.yaml \
              -f compose.ollama-download.yaml --profile ollama config --quiet
          FETCHHARBOR_PUBLIC_HOST=fetchharbor.example.com \
            docker compose -f compose.yaml -f compose.production.yaml \
              -f compose.gpu.yaml --profile ollama config --quiet
          FETCHHARBOR_PUBLIC_HOST=fetchharbor.example.com \
            docker compose -f compose.yaml -f compose.production.yaml \
              -f compose.media.yaml config --quiet

      - name: Build release images
        run: |
          docker build --target runtime --tag fetchharbor:runtime .
          docker build --file Dockerfile.media --tag fetchharbor:media .
          docker run --rm --entrypoint python fetchharbor:media -c \
            "from fetchharbor.media_worker import app; assert app.title.startswith('FetchHarbor private')"

      - name: Build production egress image
        run: docker compose -f compose.yaml -f compose.production.yaml build egress-proxy
        env:
          FETCHHARBOR_PUBLIC_HOST: fetchharbor.example.com

      - name: Validate Caddy configuration
        run: |
          docker run --rm \
            -e FETCHHARBOR_PUBLIC_HOST=fetchharbor.example.com \
            -v "${PWD}/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d \
            caddy validate --config /etc/caddy/Caddyfile

      - name: Confirm patched runtime package versions
        run: |
          docker run --rm fetchharbor:runtime python -c \
            "from importlib.metadata import version; from importlib.util import find_spec; assert tuple(map(int, version('msgpack').split('.'))) >= (1, 2, 1); assert find_spec('pip') is None; assert find_spec('setuptools') is None"
          docker run --rm fetchharbor:runtime sh -c \
            "test ! -e /usr/local/lib/python3.12/site-packages/msgpack-1.1.2.dist-info && test ! -e /usr/local/lib/python3.12/site-packages/setuptools-70.3.0.dist-info"

      - name: Export final runtime filesystem
        run: |
          set -euo pipefail
          container_id="$(docker create fetchharbor:runtime)"
          trap 'docker rm -f "${container_id}" >/dev/null 2>&1 || true' EXIT
          mkdir runtime-rootfs
          docker export "${container_id}" | tar -x -C runtime-rootfs

      - name: Reject stale embedded dependency metadata
        run: |
          set -euo pipefail
          matches="$(grep -RIl -E 'msgpack.{0,80}1\.1\.2|setuptools.{0,80}70\.3\.0' runtime-rootfs 2>/dev/null || true)"
          if test -n "${matches}"; then
            printf '%s\n' "${matches}"
            exit 1
          fi

      - name: Scan final runtime filesystem
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: rootfs
          scan-ref: runtime-rootfs
          version: v0.72.0
          cache: false
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan media worker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: fetchharbor:media
          version: v0.72.0
          cache: false
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Exercise production network topology
        env:
          FETCHHARBOR_ENV: production
          FETCHHARBOR_PUBLIC_HOST: fetchharbor.example.com
          ADMIN_TOKEN: ci-only-admin-token-with-at-least-32-characters
        run: |
          set -euo pipefail
          docker compose -p fetchharbor-prod-ci \
            -f compose.yaml -f compose.production.yaml \
            up --build --wait --wait-timeout 120 \
              api egress-proxy admin admin-loopback

          runtime_container=fetchharbor-prod-ci-api-1
          admin_container=fetchharbor-prod-ci-admin-1
          docker inspect --format \
            'networks={{json .NetworkSettings.Networks}} port_bindings={{json .HostConfig.PortBindings}}' \
            "${runtime_container}"
          test "$(docker inspect --format '{{json .NetworkSettings.Networks}}' "${runtime_container}" \
            | python -c 'import json,sys; print(len(json.load(sys.stdin)))')" = '1'
          docker inspect "${runtime_container}" \
            | python -c 'import json,sys; assert not json.load(sys.stdin)[0]["HostConfig"]["PortBindings"]'
          docker exec "${runtime_container}" sh -c 'test -w /app/data'
          docker exec "${runtime_container}" python -c \
            "import httpx; response=httpx.get('http://127.0.0.1:8080/health/ready', headers={'Host':'localhost'}, trust_env=False); response.raise_for_status(); assert response.json()['status'] == 'ready'"
          docker exec "${runtime_container}" python -c \
            "import httpx; response=httpx.get('http://127.0.0.1:8080/scrape', params={'url':'https://example.com/'}, headers={'Host':'localhost'}, timeout=30, trust_env=False); response.raise_for_status(); assert response.json()['status'] == 'success'"
          docker exec "${runtime_container}" python -c \
            "import httpx; assert httpx.get('http://127.0.0.1:8080/admin', headers={'Host':'localhost'}, trust_env=False).status_code == 404"
          test "$(docker inspect --format '{{json .NetworkSettings.Networks}}' "${admin_container}" \
            | python -c 'import json,sys; print(len(json.load(sys.stdin)))')" = '1'
          test "$(curl --silent --output /tmp/admin-unauthorized.json --write-out '%{http_code}' \
            http://127.0.0.1:8081/admin/api/overview)" = '401'
          curl --fail --silent --show-error \
            -H "X-Admin-Token: ${ADMIN_TOKEN}" \
            http://127.0.0.1:8081/admin/api/overview \
            | tee /tmp/admin.json
          grep --fixed-strings '"service_count":3' /tmp/admin.json
          test "$(curl --silent --output /tmp/x402-enable.json --write-out '%{http_code}' \
            -X PUT -H "X-Admin-Token: ${ADMIN_TOKEN}" -H 'Content-Type: application/json' \
            --data '{"payment_mode":"x402"}' \
            http://127.0.0.1:8081/admin/api/configuration)" = '422'
          curl --fail --silent --show-error \
            -H "X-Admin-Token: ${ADMIN_TOKEN}" \
            http://127.0.0.1:8081/admin/api/security \
            | tee /tmp/security.json
          grep --fixed-strings '"status":"warning"' /tmp/security.json

      - name: Tear down production topology
        if: always()
        run: |
          docker compose -p fetchharbor-prod-ci \
            -f compose.yaml -f compose.production.yaml \
            down --volumes --remove-orphans

      - name: Start the Compose API
        run: docker compose up --build --wait --wait-timeout 120 api

      - name: Exercise public contracts
        run: |
          set -euo pipefail
          curl --fail --silent --show-error http://127.0.0.1:8080/health | tee /tmp/health.json
          grep --fixed-strings '"status":"ok"' /tmp/health.json

          curl --fail --silent --show-error \
            'http://127.0.0.1:8080/html-to-md?html=%3Ch1%3EHello%3C%2Fh1%3E' \
            | tee /tmp/markdown.json
          grep --fixed-strings '"markdown":"# Hello"' /tmp/markdown.json

          test "$(curl --silent --output /tmp/public-admin.json --write-out '%{http_code}' \
            http://127.0.0.1:8080/admin)" = '404'

      - name: Inspect running stack
        run: |
          docker compose ps
          test "$(docker inspect --format '{{.State.Health.Status}}' fetchharbor-api-1)" = 'healthy'
          docker exec fetchharbor-api-1 sh -c 'test -w /app/data'

      - name: Show logs after failure
        if: failure()
        run: docker compose logs --no-color --timestamps

      - name: Tear down validation stack
        if: always()
        run: |
          docker compose down --volumes --remove-orphans
          docker compose -p fetchharbor-prod-ci \
            -f compose.yaml -f compose.production.yaml \
            down --volumes --remove-orphans
