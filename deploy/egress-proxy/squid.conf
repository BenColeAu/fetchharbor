http_port 3128
pid_filename none
cache deny all
access_log stdio:/dev/stdout
cache_log /dev/stderr
pinger_enable off

acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT
acl blocked_destination dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4
acl blocked_destination dst ::/128 ::1/128 fc00::/7 fe80::/10 ff00::/8

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny blocked_destination
http_access allow all

forwarded_for delete
via off
request_header_access X-Forwarded-For deny all
