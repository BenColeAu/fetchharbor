services:
  api:
    ports: !reset []
    networks: !override [internal]
    environment:
      FETCHHARBOR_ADMIN_TOKEN_FILE: /run/secrets/admin_token
      FETCHHARBOR_OUTBOUND_PROXY_URL: http://egress-proxy:3128
      FETCHHARBOR_REQUIRE_OUTBOUND_PROXY: "true"
      HTTP_PROXY: http://egress-proxy:3128
      HTTPS_PROXY: http://egress-proxy:3128
      NO_PROXY: localhost,127.0.0.1,api,egress-proxy,ollama
    secrets: [admin_token]
    depends_on:
      egress-proxy:
        condition: service_healthy

  ingress:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      FETCHHARBOR_PUBLIC_HOST: ${FETCHHARBOR_PUBLIC_HOST:?set public hostname}
      FETCHHARBOR_ADMIN_HOST: ${FETCHHARBOR_ADMIN_HOST:?set private admin hostname}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    networks: [edge, internal]
    depends_on:
      api:
        condition: service_healthy

  egress-proxy:
    build: ./deploy/egress-proxy
    restart: unless-stopped
    read_only: true
    tmpfs: ["/run:size=16m", "/var/log/squid:size=32m", "/var/spool/squid:size=32m"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD-SHELL", "squidclient -h 127.0.0.1 -p 3128 mgr:info 2>/dev/null | grep -q '^Squid Object Cache:'"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [edge, internal]

secrets:
  admin_token:
    file: ${FETCHHARBOR_ADMIN_TOKEN_SECRET_FILE:-./secrets/admin_token.txt}

volumes:
  caddy-data: {}
  caddy-config: {}
