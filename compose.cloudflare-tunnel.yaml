services:
  api:
    environment:
      FETCHHARBOR_REQUEST_SOURCE_PROXY: cloudflare

  ingress:
    profiles: ["direct-ingress"]

  cloudflared:
    image: cloudflare/cloudflared:2026.8.2@sha256:0aa26e284f05e6c77ae375b8c9c11d9eb6a448fb7bcd8d40f31cb6176189eb38
    command: ["tunnel", "--no-autoupdate", "run", "--token-file", "/run/secrets/cloudflare_tunnel_token"]
    secrets: [cloudflare_tunnel_token]
    restart: unless-stopped
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    networks: [edge, internal]
    depends_on:
      api:
        condition: service_healthy

secrets:
  cloudflare_tunnel_token:
    file: ${CLOUDFLARE_TUNNEL_TOKEN_SECRET_FILE:-./secrets/cloudflare_tunnel_token.txt}
