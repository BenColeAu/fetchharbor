name: fetchharbor
services:
  api:
    build:
      context: .
      target: runtime
    env_file: [.env]
    ports: ["${FETCHHARBOR_PORT:-8080}:8080"]
    volumes: ["fetchharbor-data:/app/data"]
    restart: unless-stopped
    mem_limit: 2g
    mem_reservation: 512m
    cpus: 2
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    stop_grace_period: 30s
    networks: [edge, internal]

  ollama:
    image: ollama/ollama:latest@sha256:77f1a2a54460f0380f2611e1464233d9b82cb6e58afc8f60abec0061049d2d82
    profiles: ["ollama"]
    volumes: ["ollama-data:/root/.ollama"]
    restart: unless-stopped
    networks: [internal]

  mcp:
    build:
      context: .
      target: runtime
    profiles: ["mcp"]
    command: ["python", "-m", "fetchharbor.integrations.mcp_server"]
    env_file: [.env]
    restart: unless-stopped
    networks: [internal]

networks:
  edge: {}
  internal:
    internal: true

volumes:
  fetchharbor-data: {}
  ollama-data: {}
